name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        django: ['4.2', '5.2']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Check lockfile
        run: uv lock --check --no-config

      - name: Run format
        if: matrix.python-version == '3.13' && matrix.django == '5.2'
        run: uv run nox -s format

      - name: Run lint
        if: matrix.python-version == '3.13' && matrix.django == '5.2'
        run: uv run nox -s lint

      - name: Run tests
        env:
          DJANGO: ${{ matrix.django }}
        run: uv run nox -s tests

      - name: Build docs
        if: matrix.python-version == '3.13' && matrix.django == '5.2'
        run: uv run nox -s docs

  postgres-recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: durable_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DB_BACKEND: postgres
      POSTGRES_DB: durable_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'django>=5.2,<5.3' 'pytest~=8.2' 'psycopg[binary]'
      - run: python manage.py migrate --noinput
      - run: python -m pytest testproj/tests/test_recovery.py testproj/tests/test_postgres_concurrency.py testproj/tests/test_sync_api.py testproj/tests/test_versioning.py -q
